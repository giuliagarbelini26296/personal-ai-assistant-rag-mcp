[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-assistant-rag-mcp"
version = "0.1.0"
description = "Assistente pessoal de estudo com RAG, tool calling e servidor MCP (projeto de portfólio)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Giulia Garbelini" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]
