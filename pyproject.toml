[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-assistant-rag-mcp"
version = "0.1.0"
description = "Assistente pessoal de estudo com RAG, tool calling e servidor MCP (projeto de portfólio)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Giulia Garbelini" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "mcp>=2.3,<3",
    "opentelemetry-api>=1.27,<2",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
pgvector = ["psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
observability = ["opentelemetry-sdk>=1.27,<2", "opentelemetry-exporter-otlp-proto-http>=1.27,<2"]
azure = ["opentelemetry-sdk>=1.27,<2", "azure-monitor-opentelemetry-exporter>=1.0.0b30"]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "opentelemetry-sdk>=1.27,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]
